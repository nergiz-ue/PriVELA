[project]
name = "privela"
version = "0.1.0"
description = "Representation-aware benchmarking of privacy-preserving location analytics under secure multi-party computation (MP-SPDZ)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nergiz Yuca" },
    { name = "Nikolay Matyunin" },
    { name = "Stefan Katzenbeisser" },
]
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "h3>=4.0",
    "pyproj>=3.5",
    "networkx>=3.0",
]

[project.optional-dependencies]
# optional, to generate the road-network representation from raw GPS.
roadprep = [
    "osmnx>=1.9",
    "leuvenmapmatching>=1.1",
    "rtree>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
privela = "privela.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["privela"]

[tool.ruff]
line-length = 100
extend-exclude = ["Programs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
